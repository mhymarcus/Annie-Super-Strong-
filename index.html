<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>甜蜜健身記錄 | Sweet Workout Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Noto Sans TC & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        rose: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            200: '#fecdd3',
                            300: '#fda4af',
                            400: '#fb7185',
                            500: '#f43f5e',
                            600: '#e11d48',
                            700: '#be123c',
                        },
                        warm: {
                            50: '#fafaf9',
                            100: '#f5f5f4',
                            200: '#e7e5e4',
                            800: '#292524',
                            900: '#1c1917',
                        },
                        coral: {
                            400: '#ff8a75',
                            500: '#ff6b52',
                        }
                    },
                    fontFamily: {
                        sans: ['Noto Sans TC', 'Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Noto Sans TC', 'Outfit', sans-serif;
            background-color: #fffafb;
            color: #33272a;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 228, 230, 0.6);
        }
        .glass-nav {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            border-top: 1px solid rgba(254, 205, 211, 0.5);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #fecdd3;
            border-radius: 4px;
        }
        .timer-circle {
            transition: stroke-dashoffset 0.3s linear;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-24 md:pb-8 max-w-md mx-auto relative shadow-2xl bg-gradient-to-b from-rose-50/50 via-white to-rose-50/30">

    <!-- Top Bar with Custom Encouragement -->
    <header class="p-5 pt-7 bg-gradient-to-r from-rose-100/80 via-rose-50 to-pink-100/80 rounded-b-3xl shadow-sm border-b border-rose-200/50 relative overflow-hidden">
        <div class="absolute -right-6 -top-6 w-24 h-24 bg-rose-200/40 rounded-full blur-xl pointer-events-none"></div>
        <div class="absolute -left-6 -bottom-6 w-28 h-28 bg-pink-200/40 rounded-full blur-xl pointer-events-none"></div>

        <div class="flex justify-between items-center relative z-10">
            <div class="flex items-center space-x-3">
                <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-rose-400 to-pink-300 flex items-center justify-center text-white font-bold text-lg shadow-md ring-2 ring-white">
                    <span id="userAvatar">❤️</span>
                </div>
                <div>
                    <div class="flex items-center space-x-1">
                        <h1 class="text-xl font-bold text-gray-800" id="userNameDisplay">寶貝寶貝</h1>
                        <button onclick="openProfileModal()" class="text-xs text-rose-400 hover:text-rose-600 p-1">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>
                    </div>
                    <p class="text-xs text-rose-500 font-medium flex items-center gap-1 mt-0.5">
                        <i class="fa-solid fa-sparkles text-rose-400"></i>
                        <span id="dailyGreeting">今天也要加油，你最棒了！</span>
                    </p>
                </div>
            </div>
            <div class="text-right">
                <span class="text-xs text-gray-400 font-medium block" id="currentDateStr">2026-09-26</span>
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-rose-100 text-rose-600 mt-1 shadow-xs">
                    <i class="fa-solid fa-fire text-rose-500 mr-1 text-[10px]"></i>連續 <span id="streakDaysCount">0</span> 天
                </span>
            </div>
        </div>

        <!-- Heart Motivation Card -->
        <div class="mt-4 bg-white/70 backdrop-blur-sm p-3 rounded-2xl border border-rose-100 flex items-center justify-between text-xs text-rose-700">
            <div class="flex items-center space-x-2">
                <span class="text-base">💌</span>
                <p class="italic text-gray-600" id="encouragementNote">「每完成一個組數，都離更自信的自己近一步！」</p>
            </div>
        </div>
    </header>

    <!-- Main Content Containers -->
    <main class="flex-1 p-4 space-y-5">

        <!-- Tab 1: 今日課表 (Workout Plan / Today's Routine) -->
        <section id="tab-plan" class="tab-content space-y-4">
            <div class="flex justify-between items-center">
                <div>
                    <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                        <i class="fa-solid fa-calendar-check text-rose-500"></i> 今日運動課表
                    </h2>
                    <p class="text-xs text-gray-500">看清楚目標，今天也要美美的訓練！</p>
                </div>
                <button onclick="openSelectExerciseModal()" class="px-3 py-1.5 bg-rose-500 hover:bg-rose-600 text-white text-xs font-medium rounded-xl shadow-md transition-all active:scale-95 flex items-center gap-1">
                    <i class="fa-solid fa-plus text-xs"></i> 新增動作
                </button>
            </div>

            <!-- Warmup / Cooldown Quick Tips -->
            <div class="bg-gradient-to-r from-amber-50 to-orange-50 p-3.5 rounded-2xl border border-amber-100 text-xs text-amber-800 flex items-start gap-2.5 shadow-xs">
                <i class="fa-solid fa-lightbulb text-amber-500 text-sm mt-0.5"></i>
                <div>
                    <span class="font-bold">溫馨小提醒：</span>
                    <p class="text-amber-700/90 mt-0.5">訓練前記得做 5 分鐘動態拉筋，訓練後補充足夠水分與蛋白質喔！</p>
                </div>
            </div>

            <!-- Planned Exercises List Container -->
            <div id="planListContainer" class="space-y-3">
                <!-- Rendered dynamically -->
            </div>
        </section>

        <!-- Tab 2: 實時記錄與計時 (Live Tracker & Rest Timer) -->
        <section id="tab-tracker" class="tab-content hidden space-y-4">
            <div class="flex justify-between items-center">
                <div>
                    <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                        <i class="fa-solid fa-dumbbell text-rose-500"></i> 實時記錄組數
                    </h2>
                    <p class="text-xs text-gray-500">認真填寫每一組重量與次數喔！</p>
                </div>
                <button onclick="finishWorkoutSession()" class="px-3 py-1.5 bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-medium rounded-xl shadow-md transition-all active:scale-95 flex items-center gap-1">
                    <i class="fa-solid fa-check"></i> 完成今日訓練
                </button>
            </div>

            <!-- Rest Timer Widget -->
            <div class="glass-card p-4 rounded-3xl shadow-sm text-center relative overflow-hidden border border-rose-100">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-semibold text-rose-600 flex items-center gap-1">
                        <i class="fa-regular fa-clock"></i> 休息計時器
                    </span>
                    <span id="timerStatus" class="text-[10px] bg-rose-100 text-rose-600 px-2 py-0.5 rounded-full font-medium">準備中</span>
                </div>

                <div class="text-3xl font-extrabold text-gray-800 my-1 font-mono tracking-wider" id="timerDisplay">
                    01:00
                </div>

                <!-- Timer Quick Buttons -->
                <div class="flex justify-center gap-2 mt-3">
                    <button onclick="setTimerSeconds(30)" class="px-2.5 py-1 bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs rounded-lg font-medium border border-rose-200 transition">30秒</button>
                    <button onclick="setTimerSeconds(60)" class="px-2.5 py-1 bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs rounded-lg font-medium border border-rose-200 transition">60秒</button>
                    <button onclick="setTimerSeconds(90)" class="px-2.5 py-1 bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs rounded-lg font-medium border border-rose-200 transition">90秒</button>
                    <button onclick="startTimer()" id="btnStartTimer" class="px-4 py-1 bg-rose-500 hover:bg-rose-600 text-white text-xs rounded-lg font-semibold shadow-sm transition">
                        <i class="fa-solid fa-play mr-1"></i>開始
                    </button>
                    <button onclick="resetTimer()" class="px-2 py-1 bg-gray-100 hover:bg-gray-200 text-gray-600 text-xs rounded-lg transition">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                </div>
            </div>

            <!-- Active Workout Exercises Container -->
            <div id="trackerExercisesContainer" class="space-y-4">
                <!-- Active exercises cards rendered here -->
            </div>
        </section>

        <!-- Tab 3: 動作庫 (Exercise Library) -->
        <section id="tab-library" class="tab-content hidden space-y-4">
            <div class="flex justify-between items-center">
                <div>
                    <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                        <i class="fa-solid fa-book-open-reader text-rose-500"></i> 專屬動作庫
                    </h2>
                    <p class="text-xs text-gray-500">探索與管理你的訓練項目</p>
                </div>
                <button onclick="openCreateCustomExerciseModal()" class="px-3 py-1.5 bg-rose-500 hover:bg-rose-600 text-white text-xs font-medium rounded-xl shadow-md transition-all active:scale-95 flex items-center gap-1">
                    <i class="fa-solid fa-plus text-xs"></i> 自訂動作
                </button>
            </div>

            <!-- Category Filter Pills -->
            <div class="flex space-x-2 overflow-x-auto pb-1 custom-scrollbar text-xs">
                <button onclick="filterLibrary('全選')" class="lib-filter-btn px-3 py-1.5 rounded-xl bg-rose-500 text-white font-medium whitespace-nowrap shadow-xs">全部</button>
                <button onclick="filterLibrary('臀腿')" class="lib-filter-btn px-3 py-1.5 rounded-xl bg-white text-gray-600 font-medium whitespace-nowrap border border-gray-200">🍑 臀腿</button>
                <button onclick="filterLibrary('背部')" class="lib-filter-btn px-3 py-1.5 rounded-xl bg-white text-gray-600 font-medium whitespace-nowrap border border-gray-200">🦋 背部</button>
                <button onclick="filterLibrary('胸肩')" class="lib-filter-btn px-3 py-1.5 rounded-xl bg-white text-gray-600 font-medium whitespace-nowrap border border-gray-200">✨ 胸肩</button>
                <button onclick="filterLibrary('核心')" class="lib-filter-btn px-3 py-1.5 rounded-xl bg-white text-gray-600 font-medium whitespace-nowrap border border-gray-200">🔥 核心</button>
                <button onclick="filterLibrary('手臂')" class="lib-filter-btn px-3 py-1.5 rounded-xl bg-white text-gray-600 font-medium whitespace-nowrap border border-gray-200">💪 手臂</button>
            </div>

            <!-- Library Grid -->
            <div id="libraryListContainer" class="grid grid-cols-1 gap-3">
                <!-- Rendered dynamically -->
            </div>
        </section>

        <!-- Tab 4: 歷程與統計 (History & Stats) -->
        <section id="tab-history" class="tab-content hidden space-y-4">
            <div>
                <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                    <i class="fa-solid fa-chart-line text-rose-500"></i> 訓練成果與紀錄
                </h2>
                <p class="text-xs text-gray-500">每一份汗水都是成長的印記！</p>
            </div>

            <!-- Stats Overview Cards -->
            <div class="grid grid-cols-3 gap-2.5">
                <div class="glass-card p-3 rounded-2xl text-center border border-rose-100">
                    <p class="text-[10px] text-gray-400 font-medium">累積完成</p>
                    <p class="text-lg font-bold text-rose-500 mt-1"><span id="statTotalWorkouts">0</span> <span class="text-xs text-gray-500 font-normal">次</span></p>
                </div>
                <div class="glass-card p-3 rounded-2xl text-center border border-rose-100">
                    <p class="text-[10px] text-gray-400 font-medium">累積總容量</p>
                    <p class="text-lg font-bold text-rose-500 mt-1"><span id="statTotalVolume">0</span> <span class="text-xs text-gray-500 font-normal">kg</span></p>
                </div>
                <div class="glass-card p-3 rounded-2xl text-center border border-rose-100">
                    <p class="text-[10px] text-gray-400 font-medium">總完成組數</p>
                    <p class="text-lg font-bold text-rose-500 mt-1"><span id="statTotalSets">0</span> <span class="text-xs text-gray-500 font-normal">組</span></p>
                </div>
            </div>

            <!-- Workout History Logs -->
            <div class="space-y-3">
                <h3 class="text-sm font-bold text-gray-700 flex items-center justify-between">
                    <span><i class="fa-regular fa-clock text-rose-400 mr-1"></i>歷史紀錄</span>
                    <button onclick="clearHistoryConfirm()" class="text-xs text-gray-400 hover:text-rose-500">清除紀錄</button>
                </h3>
                <div id="historyLogsContainer" class="space-y-3">
                    <!-- History log items rendered here -->
                </div>
            </div>
        </section>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto glass-nav z-30 px-3 py-2 flex justify-around items-center rounded-t-3xl shadow-lg">
        <button onclick="switchTab('plan')" id="nav-plan" class="nav-btn flex flex-col items-center py-1 px-3 rounded-2xl text-rose-500 transition">
            <i class="fa-solid fa-list-check text-lg"></i>
            <span class="text-[10px] font-medium mt-0.5">今日課表</span>
        </button>
        <button onclick="switchTab('tracker')" id="nav-tracker" class="nav-btn flex flex-col items-center py-1 px-3 rounded-2xl text-gray-400 hover:text-rose-400 transition relative">
            <i class="fa-solid fa-stopwatch text-lg"></i>
            <span class="text-[10px] font-medium mt-0.5">實時記錄</span>
            <span id="trackerBadge" class="hidden absolute top-1 right-2 w-2 h-2 bg-rose-500 rounded-full animate-ping"></span>
        </button>
        <button onclick="switchTab('library')" id="nav-library" class="nav-btn flex flex-col items-center py-1 px-3 rounded-2xl text-gray-400 hover:text-rose-400 transition">
            <i class="fa-solid fa-dumbbell text-lg"></i>
            <span class="text-[10px] font-medium mt-0.5">動作庫</span>
        </button>
        <button onclick="switchTab('history')" id="nav-history" class="nav-btn flex flex-col items-center py-1 px-3 rounded-2xl text-gray-400 hover:text-rose-400 transition">
            <i class="fa-solid fa-heart-pulse text-lg"></i>
            <span class="text-[10px] font-medium mt-0.5">成果紀錄</span>
        </button>
    </nav>

    <!-- Modal 1: Edit Profile / Encourage Message -->
    <div id="modalProfile" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-5 space-y-4 shadow-xl border border-rose-100">
            <div class="flex justify-between items-center border-b border-gray-100 pb-3">
                <h3 class="font-bold text-gray-800 text-base flex items-center gap-1.5">
                    <i class="fa-solid fa-heart text-rose-500"></i> 設定個人愛意資料
                </h3>
                <button onclick="closeModal('modalProfile')" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block font-medium text-gray-700 mb-1">對她的暱稱</label>
                    <input type="text" id="inputNickname" class="w-full px-3 py-2 rounded-xl border border-gray-200 focus:outline-none focus:border-rose-400" placeholder="例如：親愛的 / 寶貝">
                </div>
                <div>
                    <label class="block font-medium text-gray-700 mb-1">給她的每日鼓勵語</label>
                    <textarea id="inputGreeting" rows="2" class="w-full px-3 py-2 rounded-xl border border-gray-200 focus:outline-none focus:border-rose-400" placeholder="例如：今天也要加油，你最棒了！"></textarea>
                </div>
                <div>
                    <label class="block font-medium text-gray-700 mb-1">愛意悄悄話卡片</label>
                    <textarea id="inputEncouragement" rows="2" class="w-full px-3 py-2 rounded-xl border border-gray-200 focus:outline-none focus:border-rose-400" placeholder="寫在卡片上的悄悄話..."></textarea>
                </div>
            </div>
            <div class="pt-2 flex gap-2">
                <button onclick="saveProfileSettings()" class="w-full py-2.5 bg-rose-500 hover:bg-rose-600 text-white font-semibold rounded-xl text-xs shadow-md transition">儲存變更</button>
            </div>
        </div>
    </div>

    <!-- Modal 2: Select Exercise to Add to Today's Plan -->
    <div id="modalSelectExercise" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 space-y-4 max-h-[85vh] flex flex-col shadow-xl">
            <div class="flex justify-between items-center border-b border-gray-100 pb-3">
                <h3 class="font-bold text-gray-800 text-base">選取動作加入今日課表</h3>
                <button onclick="closeModal('modalSelectExercise')" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <!-- Quick Add Form -->
            <div class="overflow-y-auto space-y-3 custom-scrollbar flex-1 pr-1" id="selectExerciseList">
                <!-- Select list rendered dynamically -->
            </div>
        </div>
    </div>

    <!-- Modal 3: Create Custom Exercise -->
    <div id="modalCustomExercise" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-5 space-y-4 shadow-xl border border-rose-100">
            <div class="flex justify-between items-center border-b border-gray-100 pb-3">
                <h3 class="font-bold text-gray-800 text-base">新增自訂訓練動作</h3>
                <button onclick="closeModal('modalCustomExercise')" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block font-medium text-gray-700 mb-1">動作名稱</label>
                    <input type="text" id="inputExName" class="w-full px-3 py-2 rounded-xl border border-gray-200 focus:outline-none focus:border-rose-400" placeholder="例如：彈力帶臀外展">
                </div>
                <div>
                    <label class="block font-medium text-gray-700 mb-1">肌肉部位</label>
                    <select id="selectExCategory" class="w-full px-3 py-2 rounded-xl border border-gray-200 focus:outline-none focus:border-rose-400 bg-white">
                        <option value="臀腿">🍑 臀腿</option>
                        <option value="背部">🦋 背部</option>
                        <option value="胸肩">✨ 胸肩</option>
                        <option value="核心">🔥 核心</option>
                        <option value="手臂">💪 手臂</option>
                    </select>
                </div>
                <div>
                    <label class="block font-medium text-gray-700 mb-1">預設目標組數 / 次數</label>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="inputExTargetSets" class="px-3 py-2 rounded-xl border border-gray-200 focus:outline-none focus:border-rose-400" placeholder="組數 (如: 4)" value="4">
                        <input type="number" id="inputExTargetReps" class="px-3 py-2 rounded-xl border border-gray-200 focus:outline-none focus:border-rose-400" placeholder="次數 (如: 12)" value="12">
                    </div>
                </div>
                <div>
                    <label class="block font-medium text-gray-700 mb-1">動作提示 / 貼心要領</label>
                    <textarea id="inputExNotes" rows="2" class="w-full px-3 py-2 rounded-xl border border-gray-200 focus:outline-none focus:border-rose-400" placeholder="例如：頂峰收縮停頓1秒，感受臀部發力"></textarea>
                </div>
            </div>
            <div class="pt-2">
                <button onclick="saveCustomExercise()" class="w-full py-2.5 bg-rose-500 hover:bg-rose-600 text-white font-semibold rounded-xl text-xs shadow-md transition">新增至動作庫</button>
            </div>
        </div>
    </div>

    <script>
        // Default Pre-populated Exercises (Traditional Chinese)
        const DEFAULT_EXERCISES = [
            { id: 'ex_1', name: '杠鈴/槓鈴臀推', category: '臀腿', icon: '🍑', defaultSets: 4, defaultReps: 12, notes: '背部靠著椅凳，頂峰收縮夾緊臀部1-2秒。' },
            { id: 'ex_2', name: '高背槓/啞鈴深蹲', category: '臀腿', icon: '🦵', defaultSets: 4, defaultReps: 10, notes: '核心收緊，膝蓋順著腳尖方向，保持呼吸順暢。' },
            { id: 'ex_3', name: '羅馬尼亞硬舉 (RDL)', category: '臀腿', icon: '🍑', defaultSets: 3, defaultReps: 12, notes: '髖關節後推，感受臀大肌與大腿後側拉伸感。' },
            { id: 'ex_4', name: '滑輪下拉 (Lat Pulldown)', category: '背部', icon: '🦋', defaultSets: 4, defaultReps: 12, notes: '挺胸不挺腰，用背肌帶動手肘向下拉。' },
            { id: 'ex_5', name: '坐姿啞鈴划船', category: '背部', icon: '🛶', defaultSets: 3, defaultReps: 12, notes: '保持背部平直，感受肩胛骨夾緊的感覺。' },
            { id: 'ex_6', name: '上胸啞鈴臥推', category: '胸肩', icon: '✨', defaultSets: 3, defaultReps: 12, notes: '調整椅背約30度，下放時手肘呈90度。' },
            { id: 'ex_7', name: '啞鈴側平舉 (飛鳥)', category: '胸肩', icon: '🦅', defaultSets: 4, defaultReps: 15, notes: '沉肩，微曲手肘，發力帶到肩膀側三角肌。' },
            { id: 'ex_8', name: '棒式 / 板凳支撐', category: '核心', icon: '🔥', defaultSets: 3, defaultReps: 45, notes: '收緊腹部與臀部，保持身體呈現直線。' },
            { id: 'ex_9', name: '死蟲式 (Deadbug)', category: '核心', icon: '🐞', defaultSets: 3, defaultReps: 15, notes: '下背部緊貼地面，對側手腳緩慢伸展。' }
        ];

        // Default Planned Exercises for Today
        const DEFAULT_TODAY_PLAN = [
            { id: 'ex_1', name: '杠鈴/槓鈴臀推', category: '臀腿', targetSets: 4, targetReps: 12, notes: '頂峰收縮夾緊臀部1-2秒' },
            { id: 'ex_3', name: '羅馬尼亞硬舉 (RDL)', category: '臀腿', targetSets: 3, targetReps: 12, notes: '髖關節後推，拉伸大腿後側' },
            { id: 'ex_4', name: '滑輪下拉 (Lat Pulldown)', category: '背部', targetSets: 4, targetReps: 12, notes: '沉肩挺胸，手肘引導下壓' }
        ];

        // State Management
        let appData = {
            profile: {
                nickname: '寶貝寶貝',
                greeting: '今天也要加油，你最棒了！',
                encouragement: '「每完成一個組數，都離更自信的自己近一步！」',
                streak: 3
            },
            exercises: [...DEFAULT_EXERCISES],
            todayPlan: [...DEFAULT_TODAY_PLAN],
            activeSession: {}, // Keyed by exercise id: [{ weight: 20, reps: 12, completed: true }]
            history: []
        };

        // Timer Variables
        let timerInterval = null;
        let timerRemaining = 60;
        let timerTotal = 60;

        // --- Initialization ---
        window.onload = function() {
            loadFromLocalStorage();
            updateDateDisplay();
            renderProfile();
            renderTodayPlan();
            renderActiveTracker();
            renderLibrary('全選');
            renderHistory();
        };

        function updateDateDisplay() {
            const now = new Date();
            const options = { year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short' };
            document.getElementById('currentDateStr').innerText = now.toLocaleDateString('zh-TW', options);
        }

        // --- LocalStorage Operations ---
        function saveToLocalStorage() {
            localStorage.setItem('sweet_fitness_app_data', JSON.stringify(appData));
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('sweet_fitness_app_data');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    appData = { ...appData, ...parsed };
                } catch(e) {
                    console.error("Local storage load error", e);
                }
            }
        }

        // --- Profile Management ---
        function renderProfile() {
            document.getElementById('userNameDisplay').innerText = appData.profile.nickname || '寶貝寶貝';
            document.getElementById('dailyGreeting').innerText = appData.profile.greeting || '今天也要加油，你最棒了！';
            document.getElementById('encouragementNote').innerText = appData.profile.encouragement || '「每完成一個組數，都離更自信的自己近一步！」';
            document.getElementById('streakDaysCount').innerText = appData.profile.streak || 0;
        }

        function openProfileModal() {
            document.getElementById('inputNickname').value = appData.profile.nickname;
            document.getElementById('inputGreeting').value = appData.profile.greeting;
            document.getElementById('inputEncouragement').value = appData.profile.encouragement;
            openModal('modalProfile');
        }

        function saveProfileSettings() {
            appData.profile.nickname = document.getElementById('inputNickname').value.trim() || '寶貝寶貝';
            appData.profile.greeting = document.getElementById('inputGreeting').value.trim() || '今天也要加油！';
            appData.profile.encouragement = document.getElementById('inputEncouragement').value.trim() || '「加油！」';
            saveToLocalStorage();
            renderProfile();
            closeModal('modalProfile');
        }

        // --- Navigation ---
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');

            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-rose-500');
                btn.classList.add('text-gray-400');
            });
            document.getElementById(`nav-${tabName}`).classList.remove('text-gray-400');
            document.getElementById(`nav-${tabName}`).classList.add('text-rose-500');
        }

        // --- Tab 1: Workout Plan Logic ---
        function renderTodayPlan() {
            const container = document.getElementById('planListContainer');
            if (appData.todayPlan.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 glass-card rounded-2xl p-4">
                        <i class="fa-solid fa-heart-crack text-rose-300 text-3xl mb-2"></i>
                        <p class="text-xs text-gray-500">今日課表空空如也，點擊右上角「新增動作」吧！</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = appData.todayPlan.map((item, index) => `
                <div class="glass-card p-4 rounded-2xl shadow-xs border border-rose-100 flex justify-between items-center relative overflow-hidden group">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-xl bg-rose-100 text-rose-500 flex items-center justify-center text-lg font-bold">
                            ${getCategoryIcon(item.category)}
                        </div>
                        <div>
                            <h3 class="text-sm font-bold text-gray-800">${item.name}</h3>
                            <p class="text-xs text-rose-500 mt-0.5 font-medium">目標：${item.targetSets} 組 × ${item.targetReps} 次</p>
                            ${item.notes ? `<p class="text-[11px] text-gray-400 mt-1"><i class="fa-regular fa-note-sticky mr-1"></i>${item.notes}</p>` : ''}
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="startExerciseTrack('${item.id}')" class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-semibold rounded-xl border border-rose-200 transition">
                            開始記錄
                        </button>
                        <button onclick="removeFromPlan(${index})" class="text-gray-300 hover:text-rose-400 p-1">
                            <i class="fa-solid fa-trash-can text-sm"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function removeFromPlan(index) {
            appData.todayPlan.splice(index, 1);
            saveToLocalStorage();
            renderTodayPlan();
            renderActiveTracker();
        }

        function openSelectExerciseModal() {
            const list = document.getElementById('selectExerciseList');
            list.innerHTML = appData.exercises.map(ex => `
                <div class="p-3 border border-gray-100 hover:border-rose-200 rounded-2xl flex justify-between items-center transition bg-rose-50/30">
                    <div class="flex items-center space-x-3">
                        <span class="text-xl">${ex.icon || '💪'}</span>
                        <div>
                            <p class="text-xs font-bold text-gray-800">${ex.name}</p>
                            <p class="text-[10px] text-gray-400">${ex.category} • 建議 ${ex.defaultSets}組 × ${ex.defaultReps}次</p>
                        </div>
                    </div>
                    <button onclick="addExerciseToPlan('${ex.id}')" class="px-3 py-1 bg-rose-500 hover:bg-rose-600 text-white text-xs font-medium rounded-xl shadow-xs">
                        加入課表
                    </button>
                </div>
            `).join('');
            openModal('modalSelectExercise');
        }

        function addExerciseToPlan(exId) {
            const ex = appData.exercises.find(e => e.id === exId);
            if (!ex) return;

            // Prevent duplicate in plan
            if (appData.todayPlan.some(item => item.id === exId)) {
                alert('該動作已在今日課表中囉！');
                return;
            }

            appData.todayPlan.push({
                id: ex.id,
                name: ex.name,
                category: ex.category,
                targetSets: ex.defaultSets,
                targetReps: ex.defaultReps,
                notes: ex.notes
            });

            saveToLocalStorage();
            renderTodayPlan();
            renderActiveTracker();
            closeModal('modalSelectExercise');
        }

        // --- Tab 2: Live Tracker & Timer Logic ---
        function renderActiveTracker() {
            const container = document.getElementById('trackerExercisesContainer');

            if (appData.todayPlan.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 glass-card rounded-2xl p-4">
                        <i class="fa-solid fa-clipboard-list text-gray-300 text-3xl mb-2"></i>
                        <p class="text-xs text-gray-500">今日無進行中的動作，請先至「今日課表」新增！</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = appData.todayPlan.map(ex => {
                // Initialize activeSession for ex if empty
                if (!appData.activeSession[ex.id]) {
                    appData.activeSession[ex.id] = Array.from({ length: ex.targetSets }, () => ({
                        weight: 10,
                        reps: ex.targetReps,
                        completed: false
                    }));
                }

                const sets = appData.activeSession[ex.id];

                return `
                    <div class="glass-card p-4 rounded-2xl shadow-xs border border-rose-100 space-y-3">
                        <div class="flex justify-between items-center border-b border-rose-100 pb-2">
                            <div class="flex items-center space-x-2">
                                <span class="text-lg">${getCategoryIcon(ex.category)}</span>
                                <h3 class="text-sm font-bold text-gray-800">${ex.name}</h3>
                            </div>
                            <button onclick="addSetToExercise('${ex.id}')" class="text-xs text-rose-500 hover:text-rose-600 font-medium">
                                <i class="fa-solid fa-plus text-[10px] mr-1"></i>增加一組
                            </button>
                        </div>

                        <!-- Sets Table Headers -->
                        <div class="grid grid-cols-12 text-[11px] font-semibold text-gray-400 text-center px-1">
                            <div class="col-span-2">組數</div>
                            <div class="col-span-4">重量 (kg)</div>
                            <div class="col-span-4">次數 (reps)</div>
                            <div class="col-span-2">完成</div>
                        </div>

                        <!-- Sets Input Rows -->
                        <div class="space-y-2">
                            ${sets.map((set, sIdx) => `
                                <div class="grid grid-cols-12 items-center text-center gap-1.5 p-1 rounded-xl ${set.completed ? 'bg-emerald-50/60 border border-emerald-100' : 'bg-gray-50/80'} transition">
                                    <div class="col-span-2 font-bold text-xs ${set.completed ? 'text-emerald-600' : 'text-gray-500'}">第 ${sIdx + 1} 組</div>
                                    <div class="col-span-4">
                                        <input type="number" value="${set.weight}" onchange="updateSetVal('${ex.id}', ${sIdx}, 'weight', this.value)" 
                                            class="w-full text-center py-1 text-xs font-semibold rounded-lg border border-gray-200 focus:outline-none focus:border-rose-400 bg-white">
                                    </div>
                                    <div class="col-span-4">
                                        <input type="number" value="${set.reps}" onchange="updateSetVal('${ex.id}', ${sIdx}, 'reps', this.value)" 
                                            class="w-full text-center py-1 text-xs font-semibold rounded-lg border border-gray-200 focus:outline-none focus:border-rose-400 bg-white">
                                    </div>
                                    <div class="col-span-2 flex justify-center">
                                        <button onclick="toggleSetComplete('${ex.id}', ${sIdx})" 
                                            class="w-7 h-7 rounded-lg flex items-center justify-center transition ${set.completed ? 'bg-emerald-500 text-white shadow-xs' : 'bg-white border border-gray-300 text-gray-300'}">
                                            <i class="fa-solid fa-check text-xs"></i>
                                        </button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function startExerciseTrack(exId) {
            switchTab('tracker');
            const el = document.getElementById('trackerExercisesContainer');
            if (el) el.scrollIntoView({ behavior: 'smooth' });
        }

        function updateSetVal(exId, setIdx, field, val) {
            if (appData.activeSession[exId] && appData.activeSession[exId][setIdx]) {
                appData.activeSession[exId][setIdx][field] = parseFloat(val) || 0;
                saveToLocalStorage();
            }
        }

        function toggleSetComplete(exId, setIdx) {
            if (appData.activeSession[exId] && appData.activeSession[exId][setIdx]) {
                const currentStatus = appData.activeSession[exId][setIdx].completed;
                appData.activeSession[exId][setIdx].completed = !currentStatus;

                // Auto start timer if completed
                if (!currentStatus) {
                    startTimer();
                }

                saveToLocalStorage();
                renderActiveTracker();
            }
        }

        function addSetToExercise(exId) {
            if (!appData.activeSession[exId]) appData.activeSession[exId] = [];
            const lastSet = appData.activeSession[exId][appData.activeSession[exId].length - 1] || { weight: 10, reps: 12 };
            appData.activeSession[exId].push({
                weight: lastSet.weight,
                reps: lastSet.reps,
                completed: false
            });
            saveToLocalStorage();
            renderActiveTracker();
        }

        // --- Rest Timer Functions ---
        function setTimerSeconds(sec) {
            timerRemaining = sec;
            timerTotal = sec;
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timerRemaining / 60);
            const secs = timerRemaining % 60;
            document.getElementById('timerDisplay').innerText = 
                `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            document.getElementById('timerStatus').innerText = '計時中...';
            document.getElementById('timerStatus').className = 'text-[10px] bg-rose-500 text-white px-2 py-0.5 rounded-full font-medium animate-pulse';

            timerInterval = setInterval(() => {
                timerRemaining--;
                updateTimerDisplay();

                if (timerRemaining <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    document.getElementById('timerStatus').innerText = '休息結束！';
                    document.getElementById('timerStatus').className = 'text-[10px] bg-emerald-500 text-white px-2 py-0.5 rounded-full font-medium';
                    playTimerAlert();
                }
            }, 1000);
        }

        function resetTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = null;
            timerRemaining = timerTotal;
            updateTimerDisplay();
            document.getElementById('timerStatus').innerText = '準備中';
            document.getElementById('timerStatus').className = 'text-[10px] bg-rose-100 text-rose-600 px-2 py-0.5 rounded-full font-medium';
        }

        function playTimerAlert() {
            // Web Audio API beep sound
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.value = 587.33; // D5 note
                osc.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.5);
            } catch (e) {
                console.log('Audio context not allowed yet');
            }
        }

        function finishWorkoutSession() {
            let totalVolume = 0;
            let totalCompletedSets = 0;
            let summary = [];

            Object.keys(appData.activeSession).forEach(exId => {
                const ex = appData.exercises.find(e => e.id === exId) || appData.todayPlan.find(e => e.id === exId);
                const exName = ex ? ex.name : '訓練項目';
                const sets = appData.activeSession[exId].filter(s => s.completed);

                if (sets.length > 0) {
                    let exVol = 0;
                    sets.forEach(s => {
                        exVol += s.weight * s.reps;
                        totalCompletedSets++;
                    });
                    totalVolume += exVol;
                    summary.push(`${exName}: ${sets.length}組`);
                }
            });

            if (totalCompletedSets === 0) {
                alert('寶貝，你還沒有勾選完成任何一組訓練喔！');
                return;
            }

            // Record History
            const record = {
                id: 'log_' + Date.now(),
                date: new Date().toLocaleDateString('zh-TW'),
                time: new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' }),
                totalVolume: totalVolume,
                totalSets: totalCompletedSets,
                summary: summary.join('、 ')
            };

            appData.history.unshift(record);
            appData.profile.streak = (appData.profile.streak || 0) + 1;
            appData.activeSession = {}; // reset active tracker

            saveToLocalStorage();
            renderProfile();
            renderActiveTracker();
            renderHistory();

            alert(`🎉 太棒了！今日訓練完成！\n本次共完成 ${totalCompletedSets} 組，累積容量 ${totalVolume} kg！`);
            switchTab('history');
        }

        // --- Tab 3: Exercise Library Logic ---
        function renderLibrary(filterCat = '全選') {
            const container = document.getElementById('libraryListContainer');
            const filtered = filterCat === '全選' ? appData.exercises : appData.exercises.filter(e => e.category === filterCat);

            container.innerHTML = filtered.map(ex => `
                <div class="glass-card p-3.5 rounded-2xl border border-rose-100 flex justify-between items-center shadow-xs">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-xl bg-rose-50 text-rose-500 flex items-center justify-center text-lg">
                            ${ex.icon || getCategoryIcon(ex.category)}
                        </div>
                        <div>
                            <div class="flex items-center space-x-1.5">
                                <h4 class="text-xs font-bold text-gray-800">${ex.name}</h4>
                                <span class="text-[9px] px-1.5 py-0.2 bg-rose-100 text-rose-600 rounded-md font-medium">${ex.category}</span>
                            </div>
                            <p class="text-[11px] text-gray-400 mt-0.5">預設：${ex.defaultSets}組 × ${ex.defaultReps}次</p>
                            ${ex.notes ? `<p class="text-[10px] text-gray-500 mt-0.5">${ex.notes}</p>` : ''}
                        </div>
                    </div>
                    <button onclick="addExerciseToPlan('${ex.id}')" class="px-2.5 py-1 bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-medium rounded-xl border border-rose-200 transition">
                        + 課表
                    </button>
                </div>
            `).join('');
        }

        function filterLibrary(cat) {
            document.querySelectorAll('.lib-filter-btn').forEach(btn => {
                btn.classList.remove('bg-rose-500', 'text-white');
                btn.classList.add('bg-white', 'text-gray-600');
            });
            event.target.classList.remove('bg-white', 'text-gray-600');
            event.target.classList.add('bg-rose-500', 'text-white');

            renderLibrary(cat);
        }

        function openCreateCustomExerciseModal() {
            openModal('modalCustomExercise');
        }

        function saveCustomExercise() {
            const name = document.getElementById('inputExName').value.trim();
            const category = document.getElementById('selectExCategory').value;
            const sets = parseInt(document.getElementById('inputExTargetSets').value) || 4;
            const reps = parseInt(document.getElementById('inputExTargetReps').value) || 12;
            const notes = document.getElementById('inputExNotes').value.trim();

            if (!name) {
                alert('請輸入動作名稱！');
                return;
            }

            const newEx = {
                id: 'custom_' + Date.now(),
                name: name,
                category: category,
                icon: getCategoryIcon(category),
                defaultSets: sets,
                defaultReps: reps,
                notes: notes
            };

            appData.exercises.unshift(newEx);
            saveToLocalStorage();
            renderLibrary('全選');
            closeModal('modalCustomExercise');

            // Reset inputs
            document.getElementById('inputExName').value = '';
            document.getElementById('inputExNotes').value = '';
        }

        // --- Tab 4: History & Stats Logic ---
        function renderHistory() {
            const totalWorkouts = appData.history.length;
            const totalVol = appData.history.reduce((acc, curr) => acc + (curr.totalVolume || 0), 0);
            const totalSets = appData.history.reduce((acc, curr) => acc + (curr.totalSets || 0), 0);

            document.getElementById('statTotalWorkouts').innerText = totalWorkouts;
            document.getElementById('statTotalVolume').innerText = totalVol.toLocaleString();
            document.getElementById('statTotalSets').innerText = totalSets;

            const container = document.getElementById('historyLogsContainer');

            if (appData.history.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 glass-card rounded-2xl p-4">
                        <i class="fa-solid fa-trophy text-amber-200 text-3xl mb-2"></i>
                        <p class="text-xs text-gray-500">尚無歷史訓練紀錄，完成第一次運動吧！</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = appData.history.map(item => `
                <div class="glass-card p-3.5 rounded-2xl border border-rose-100 space-y-1.5 shadow-xs">
                    <div class="flex justify-between items-center text-xs">
                        <span class="font-bold text-gray-800 flex items-center gap-1">
                            <i class="fa-solid fa-circle-check text-emerald-500"></i> ${item.date} (${item.time})
                        </span>
                        <span class="text-rose-500 font-semibold bg-rose-50 px-2 py-0.5 rounded-md text-[11px]">
                            ${item.totalSets} 組 | ${item.totalVolume} kg
                        </span>
                    </div>
                    <p class="text-[11px] text-gray-600 line-clamp-2">${item.summary || '訓練項目概覽'}</p>
                </div>
            `).join('');
        }

        function clearHistoryConfirm() {
            if (confirm('確定要清除所有歷史訓練紀錄嗎？')) {
                appData.history = [];
                saveToLocalStorage();
                renderHistory();
            }
        }

        // --- Helper Functions ---
        function getCategoryIcon(cat) {
            switch(cat) {
                case '臀腿': return '🍑';
                case '背部': return '🦋';
                case '胸肩': return '✨';
                case '核心': return '🔥';
                case '手臂': return '💪';
                default: return '🏋️‍♀️';
            }
        }

        function openModal(modalId) {
            document.getElementById(modalId).classList.remove('hidden');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }
    </script>
</body>
</html>
